<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>✨ 로블록스 프린세스 3D ✨</title>
  <style>
    :root {
      --safe: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fecfef 50%, #a1c4fd);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      background: rgba(255, 244, 248, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 3px solid #fff;
      position: relative;
    }
    @media (min-width: 391px) {
      .phone {
        height: 94vh;
        border-radius: 28px;
        box-shadow: 0 18px 50px #0002;
      }
    }
    .header {
      height: 58px;
      flex-shrink: 0;
      padding: 8px 12px;
      background: #fffffff2;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ffd5e2;
      z-index: 20;
    }
    .title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #ff1493, #8054d6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .headerBtns {
      display: flex;
      gap: 7px;
    }
    .iconBtn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #ffb6c9;
      background: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .iconBtn:active,
    .action:active,
    .tab:active,
    .card:active {
      transform: scale(0.94);
    }
    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .stage canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .sparkle {
      position: absolute;
      pointer-events: none;
      animation: spark 0.9s ease-out forwards;
      z-index: 30;
    }
    @keyframes spark {
      0% {
        transform: scale(0) rotate(0);
        opacity: 1;
      }
      100% {
        transform: scale(1.7) rotate(180deg);
        opacity: 0;
      }
    }
    .panel {
      flex-shrink: 0;
      background: #fffffff7;
      border-top: 3px solid #ffd3e1;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -6px 25px #ff69b42b;
      z-index: 20;
      padding-bottom: var(--safe);
    }
    .tabs {
      display: flex;
      gap: 7px;
      padding: 9px 10px 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab {
      flex-shrink: 0;
      min-height: 39px;
      padding: 7px 11px;
      border-radius: 15px;
      border: 2px solid #ffd1dd;
      background: #fff5f8;
      color: #c2185b;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      border-color: #ff1493;
    }
    .selector {
      height: 96px;
      padding: 6px 10px 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
      scrollbar-width: thin;
    }
    .card {
      width: 70px;
      height: 80px;
      flex: 0 0 70px;
      border: 2px solid #ffd3df;
      border-radius: 16px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }
    .card.selected {
      border-color: #ff1493;
      background: #fff0f6;
      box-shadow: 0 5px 13px #ff149333;
      transform: scale(1.03);
    }
    .preview {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 2px;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px #0002;
      margin-bottom: 4px;
    }
    .name {
      font-size: 9px;
      font-weight: 800;
      color: #666;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      gap: 8px;
      padding: 8px 11px 11px;
      background: #fff;
      border-top: 1px solid #ffe7ef;
    }
    .action {
      flex: 1;
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .random {
      background: linear-gradient(135deg, #a9c9ff, #d8efff);
      color: #28629b;
    }
    .reset {
      background: linear-gradient(135deg, #ffe4cc, #ffc19e);
      color: #a44b20;
    }
    .pose {
      background: linear-gradient(135deg, #d8b4fe, #f0abfc);
      color: #7e22ce;
    }
    .save {
      background: linear-gradient(135deg, #ff9ca8, #ffd1ed);
      color: #a62c72;
    }
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: #ffffffee;
      backdrop-filter: blur(10px);
      padding: 14px 24px;
      border-radius: 20px;
      font-weight: 900;
      color: #ff1493;
      font-size: 15px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 50;
      box-shadow: 0 8px 30px #ff69b440;
      border: 2px solid #ffd3e1;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="header">
      <div class="title">✨ 로블록스 프린세스 ✨</div>
      <div class="headerBtns">
        <button class="iconBtn" id="poseBtn" aria-label="포즈">🙌</button>
        <button class="iconBtn" id="bgBtn" aria-label="배경 변경">🏰</button>
        <button class="iconBtn" id="soundBtn" aria-label="효과음">🎵</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="toast" id="toast"></div>
    </main>

    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="selector" id="selector"></div>
      <div class="actions">
        <button class="action random" id="randomBtn">🎲 랜덤</button>
        <button class="action reset" id="resetBtn">🔄 초기화</button>
        <button class="action pose" id="poseActionBtn">🙌 포즈</button>
        <button class="action save" id="saveBtn">📸 저장</button>
      </div>
    </section>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const $ = (sel) => document.querySelector(sel);
    const stage = $('#stage');

    // ---------- 3D 씬 ----------
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 1000);
    camera.position.set(4, 2.8, 7);
    camera.lookAt(0, 1.4, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);
    stage.appendChild(renderer.domElement);

    // 조명
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    scene.add(dirLight);
    const backLight = new THREE.DirectionalLight(0xe0c0ff, 0.4);
    backLight.position.set(-3, 2, -4);
    scene.add(backLight);

    // 무대
    const stageGeo = new THREE.CylinderGeometry(2.2, 2.4, 0.15, 32);
    const stageMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.2, metalness: 0.1 });
    const stageMesh = new THREE.Mesh(stageGeo, stageMat);
    stageMesh.position.y = -0.95;
    stageMesh.receiveShadow = true;
    scene.add(stageMesh);

    const ringGeo = new THREE.TorusGeometry(2.3, 0.06, 8, 32);
    const ringMat = new THREE.MeshStandardMaterial({ color: '#ff85b3', roughness: 0.4 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -0.87;
    scene.add(ring);

    const groundGeo = new THREE.CircleGeometry(2.5, 32);
    const groundMat = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.9;
    ground.receiveShadow = true;
    scene.add(ground);

    // OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3.5;
    controls.maxDistance = 9;
    controls.maxPolarAngle = Math.PI / 1.8;
    controls.minPolarAngle = 0.3;
    controls.update();

    // ---------- 캐릭터 ----------
    const character = new THREE.Group();
    scene.add(character);

    const matCfg = { roughness: 0.7, metalness: 0.1 };
    const skinMat = new THREE.MeshStandardMaterial({ color: '#ffd6c2', ...matCfg });
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: '#ffffff', ...matCfg });
    const eyePupilMat = new THREE.MeshStandardMaterial({ color: '#1c1420', ...matCfg });
    const mouthMat = new THREE.MeshStandardMaterial({ color: '#c95b70', ...matCfg });
    const blushMat = new THREE.MeshStandardMaterial({ color: '#ff7b98', transparent: true, opacity: 0.6, ...matCfg });

    // 머리
    const headGeo = new THREE.BoxGeometry(0.9, 0.9, 0.8);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.y = 1.8;
    head.castShadow = true;
    head.receiveShadow = true;
    character.add(head);

    // 눈 (head 로컬 좌표, z=0.4에 정확히 맞춤)
    function createEye(x, y) {
      const whiteGeo = new THREE.BoxGeometry(0.22, 0.18, 0.02);
      const white = new THREE.Mesh(whiteGeo, eyeWhiteMat);
      white.position.set(x, y, 0.41);
      head.add(white);

      const pupilGeo = new THREE.BoxGeometry(0.1, 0.1, 0.03);
      const pupil = new THREE.Mesh(pupilGeo, eyePupilMat);
      pupil.position.set(x, y - 0.02, 0.42);
      head.add(pupil);
    }
    createEye(-0.25, 0.15);
    createEye(0.25, 0.15);

    // 볼터치
    const blushGeo = new THREE.BoxGeometry(0.15, 0.08, 0.02);
    const blushLeft = new THREE.Mesh(blushGeo, blushMat);
    blushLeft.position.set(-0.35, -0.05, 0.41);
    head.add(blushLeft);
    const blushRight = new THREE.Mesh(blushGeo, blushMat);
    blushRight.position.set(0.35, -0.05, 0.41);
    head.add(blushRight);

    // 입
    const mouthGeo = new THREE.BoxGeometry(0.18, 0.06, 0.02);
    const mouth = new THREE.Mesh(mouthGeo, mouthMat);
    mouth.position.set(0, -0.15, 0.41);
    head.add(mouth);

    // 몸통
    const torsoGeo = new THREE.BoxGeometry(0.75, 1.1, 0.5);
    const torso = new THREE.Mesh(torsoGeo, skinMat);
    torso.position.y = 1.15;
    torso.castShadow = true;
    torso.receiveShadow = true;
    character.add(torso);

    // 관절
    function createLimb(w, h, d, x, y, z, mat) {
      const pivot = new THREE.Group();
      pivot.position.set(x, y, z);
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = -h / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      pivot.add(mesh);
      character.add(pivot);
      return { pivot, mesh };
    }

    const leftArm = createLimb(0.3, 0.9, 0.3, -0.55, 1.7, 0, skinMat);
    const rightArm = createLimb(0.3, 0.9, 0.3, 0.55, 1.7, 0, skinMat);
    const leftLeg = createLimb(0.35, 1.0, 0.35, -0.23, 0.7, 0, skinMat);
    const rightLeg = createLimb(0.35, 1.0, 0.35, 0.23, 0.7, 0, skinMat);

    // ---------- 아이템 그룹 ----------
    const itemsGroup = {
      dress: new THREE.Group(),
      shoes: new THREE.Group(),
      hair: new THREE.Group(),
      tiara: new THREE.Group(),
      wings: new THREE.Group(),
      accessory: new THREE.Group(),
      'hair-back': new THREE.Group()
    };
    Object.keys(itemsGroup).forEach(k => character.add(itemsGroup[k]));

    // ---------- 아이템 DB ----------
    const db = {
      dress: [
        { id: 'none', name: '없음' },
        { id: 'pinkstar', name: '핑크스타', color: '#ff77b0' },
        { id: 'lavender', name: '라벤더', color: '#ad8de0' },
        { id: 'sky', name: '하늘빛', color: '#7eccee' },
        { id: 'stage', name: '무대용', color: '#d14e94' }
      ],
      shoes: [
        { id: 'none', name: '없음' },
        { id: 'pink', name: '핑크슈즈', color: '#ff5ea1', leftPos: [-0.23, 0.18, 0.05], rightPos: [0.23, 0.18, 0.05], scale: [0.38, 0.18, 0.4] },
        { id: 'boots', name: '부츠', color: '#7699f0', leftPos: [-0.23, 0.16, 0.05], rightPos: [0.23, 0.16, 0.05], scale: [0.38, 0.45, 0.4] },
        { id: 'sneaker', name: '운동화', color: '#ffffff', leftPos: [-0.23, 0.18, 0.05], rightPos: [0.23, 0.18, 0.05], scale: [0.38, 0.2, 0.42] }
      ],
      hair: [
        { id: 'front1', name: '일자뱅', color: '#5a3e2e', type: 'wedge', pos: [0, 2.26, 0.42], scale: [0.92, 0.15, 0.3] },
        { id: 'front2', name: '둥근뱅', color: '#5a3e2e', type: 'wedge', pos: [0, 2.28, 0.42], scale: [0.85, 0.12, 0.28] },
        { id: 'front3', name: '옆머리', color: '#6d4c41', type: 'wedge', pos: [0, 2.26, 0.42], scale: [0.92, 0.15, 0.3] }
      ],
      'hair-back': [
        { id: 'none', name: '없음' },
        { id: 'long', name: '롱헤어', color: '#5a3e2e', type: 'back', pos: [0, 1.65, -0.42], scale: [0.8, 0.9, 0.3] },
        { id: 'twin', name: '트윈테일', color: '#5a3e2e', type: 'twin', leftPos: [-0.45, 1.7, -0.38], rightPos: [0.45, 1.7, -0.38], scale: [0.25, 0.7, 0.25] },
        { id: 'ponytail', name: '포니테일', color: '#5a3e2e', type: 'back', pos: [0.15, 2.05, -0.42], scale: [0.35, 0.65, 0.35] }
      ],
      tiara: [
        { id: 'none', name: '없음' },
        { id: 'heart', name: '하트티아라', color: '#ffd83d', type: 'tiara', pos: [0, 2.28, 0.42], scale: [0.7, 0.1, 0.2] },
        { id: 'star', name: '별티아라', color: '#ffe05a', type: 'tiara', pos: [0, 2.3, 0.42], scale: [0.75, 0.12, 0.22] }
      ],
      wings: [
        { id: 'none', name: '없음' },
        { id: 'fairy', name: '요정날개', color: '#c4f0ff', type: 'wings', pos: [0, 1.4, -0.4], scale: [1.1, 0.7, 0.1] },
        { id: 'crystal', name: '크리스탈', color: '#d5c5ff', type: 'wings', pos: [0, 1.4, -0.4], scale: [1.1, 0.7, 0.1] }
      ],
      accessory: [
        { id: 'none', name: '없음' },
        { id: 'wand', name: '마법봉', color: '#ff5ea1', type: 'wand', pos: [0.65, 0.55, 0.3], scale: [0.15, 0.8, 0.15] },
        { id: 'necklace', name: '목걸이', color: '#ffd447', type: 'necklace', pos: [0, 1.55, 0.32], scale: [0.5, 0.05, 0.05] },
        { id: 'ribbon', name: '리본', color: '#ff7eb3', type: 'necklace', pos: [0, 1.6, 0.32], scale: [0.45, 0.06, 0.06] }
      ]
    };

    const outfit = {
      dress: 'pinkstar',
      shoes: 'pink',
      hair: 'front1',
      'hair-back': 'long',
      tiara: 'heart',
      wings: 'fairy',
      accessory: 'wand'
    };
    const defaults = { ...outfit };

    // ---------- 메쉬 생성 ----------
    function clearGroup(group) {
      while (group.children.length > 0) group.remove(group.children[0]);
    }

    function applyItem(category, itemId) {
      const group = itemsGroup[category];
      if (!group) return;
      clearGroup(group);

      const item = db[category].find(i => i.id === itemId);

      // 드레스 벗을 때 몸통 다시 보이기
      if (category === 'dress') {
        torso.visible = (!item || item.id === 'none');
      }

      if (!item || item.id === 'none') return;

      const mat = new THREE.MeshStandardMaterial({ color: item.color, roughness: 0.7, metalness: 0.1 });

      if (category === 'dress') {
        const bodiceGeo = new THREE.BoxGeometry(0.79, 0.55, 0.54);
        const bodice = new THREE.Mesh(bodiceGeo, mat);
        bodice.position.set(0, 1.05, 0);
        bodice.castShadow = true;
        bodice.receiveShadow = true;
        group.add(bodice);

        const skirtGeo = new THREE.CylinderGeometry(0.42, 0.9, 0.75, 16);
        const skirt = new THREE.Mesh(skirtGeo, mat);
        skirt.position.set(0, 0.4, 0);
        skirt.castShadow = true;
        skirt.receiveShadow = true;
        group.add(skirt);
        return;
      }

      if (item.type === 'wedge') {
        const geo = new THREE.BoxGeometry(1, 0.2, 0.5);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.set(...item.scale);
        mesh.position.set(...item.pos);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
      } else if (item.type === 'back') {
        const geo = new THREE.BoxGeometry(0.6, 1.2, 0.4);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.set(...item.scale);
        mesh.position.set(...item.pos);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
      } else if (item.type === 'twin') {
        const geo = new THREE.BoxGeometry(0.4, 1.0, 0.4);
        const left = new THREE.Mesh(geo, mat);
        left.position.set(...item.leftPos);
        left.scale.set(...item.scale);
        left.castShadow = true;
        group.add(left);
        const right = new THREE.Mesh(geo, mat);
        right.position.set(...item.rightPos);
        right.scale.set(...item.scale);
        right.castShadow = true;
        group.add(right);
      } else if (item.type === 'tiara') {
        const geo = new THREE.TorusGeometry(0.3, 0.08, 8, 8, Math.PI);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.rotation.z = Math.PI;
        mesh.scale.set(...item.scale);
        mesh.position.set(...item.pos);
        mesh.castShadow = true;
        group.add(mesh);
      } else if (item.type === 'wings') {
        const geo = new THREE.BoxGeometry(1.2, 0.8, 0.1);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.set(...item.scale);
        mesh.position.set(...item.pos);
        mesh.castShadow = true;
        group.add(mesh);
      } else if (item.type === 'wand') {
        const stickGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 6);
        const stick = new THREE.Mesh(stickGeo, new THREE.MeshStandardMaterial({ color: '#f2b93d', roughness: 0.3, metalness: 0.5 }));
        stick.position.set(...item.pos);
        stick.rotation.z = -0.4;
        stick.castShadow = true;
        group.add(stick);

        const starGeo = new THREE.OctahedronGeometry(0.2);
        const star = new THREE.Mesh(starGeo, mat);
        star.position.set(item.pos[0] + 0.28, item.pos[1] + 0.45, item.pos[2]);
        star.rotation.z = -0.4;
        star.castShadow = true;
        group.add(star);
      } else if (item.type === 'necklace') {
        const geo = new THREE.TorusGeometry(0.35, 0.06, 8, 16);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.scale.set(...item.scale);
        mesh.position.set(...item.pos);
        mesh.castShadow = true;
        group.add(mesh);
      } else if (category === 'shoes') {
        const shoeGeo = new THREE.BoxGeometry(0.35, 0.15, 0.35);
        const left = new THREE.Mesh(shoeGeo, mat);
        left.position.set(...item.leftPos);
        left.scale.set(...item.scale);
        left.castShadow = true;
        group.add(left);
        const right = new THREE.Mesh(shoeGeo, mat);
        right.position.set(...item.rightPos);
        right.scale.set(...item.scale);
        right.castShadow = true;
        group.add(right);
      }
    }

    function updateAllItems() {
      Object.keys(outfit).forEach(cat => applyItem(cat, outfit[cat]));
    }
    updateAllItems();

    // ---------- UI ----------
    const categories = [
      ['dress', '👗 드레스'],
      ['hair', '💇‍♀️ 앞머리'],
      ['hair-back', '💇‍♀️ 뒷머리'],
      ['shoes', '👟 신발'],
      ['tiara', '👑 티아라'],
      ['wings', '🧚 날개'],
      ['accessory', '✨ 악세서리']
    ];
    let active = 'dress';
    const tabsEl = $('#tabs');
    const selectorEl = $('#selector');

    function renderTabs() {
      tabsEl.innerHTML = categories
        .map(([id, label]) => `<button class="tab ${id === active ? 'active' : ''}" data-cat="${id}">${label}</button>`)
        .join('');
    }

    function renderSelector(cat) {
      selectorEl.innerHTML = '';
      const items = db[cat] || [];
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card' + (outfit[cat] === item.id ? ' selected' : '');
        const hasColor = item.color && item.id !== 'none';
        card.innerHTML = `
          <div class="preview">${hasColor ? `<div class="color-dot" style="background:${item.color}"></div>` : '❌'}</div>
          <div class="name">${item.name}</div>
        `;
        card.onclick = () => {
          outfit[cat] = item.id;
          applyItem(cat, item.id);
          renderSelector(cat);
          soundFx();
          spawnSparkles(3);
        };
        selectorEl.appendChild(card);
      });
      const selected = selectorEl.querySelector('.selected');
      if (selected) setTimeout(() => selected.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }), 10);
    }

    tabsEl.onclick = e => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      active = btn.dataset.cat;
      renderTabs();
      renderSelector(active);
      soundFx();
    };

    // ---------- 배경 ----------
    const bgColors = [null, '#d2e7ff', '#e8d4ff', '#ffe3d4', '#d4ffd8'];
    let bgIndex = 0;
    $('#bgBtn').onclick = () => {
      bgIndex = (bgIndex + 1) % bgColors.length;
      scene.background = bgColors[bgIndex] ? new THREE.Color(bgColors[bgIndex]) : null;
      soundFx();
    };

    // ---------- 효과음 ----------
    let sound = true;
    let audioCtx = null;
    function soundFx(type = 'click') {
      if (!sound) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.type = type === 'magic' ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(type === 'magic' ? 440 : 590, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        g.gain.setValueAtTime(0.07, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        o.start();
        o.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    $('#soundBtn').onclick = () => {
      sound = !sound;
      $('#soundBtn').textContent = sound ? '🎵' : '🔇';
      if (sound) soundFx();
    };

    function spawnSparkles(n) {
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = ['✨', '✦', '💫'][i % 3];
        s.style.left = 15 + Math.random() * 70 + '%';
        s.style.top = 15 + Math.random() * 65 + '%';
        s.style.fontSize = 13 + Math.random() * 12 + 'px';
        stage.appendChild(s);
        setTimeout(() => s.remove(), 950);
      }
    }

    function showToast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1200);
    }

    // ---------- 랜덤 / 초기화 / 저장 / 포즈 ----------
    $('#randomBtn').onclick = () => {
      Object.keys(outfit).forEach(cat => {
        const arr = db[cat];
        outfit[cat] = arr[Math.floor(Math.random() * arr.length)].id;
      });
      updateAllItems();
      renderSelector(active);
      soundFx('magic');
      spawnSparkles(8);
    };

    $('#resetBtn').onclick = () => {
      Object.assign(outfit, defaults);
      updateAllItems();
      renderSelector(active);
      soundFx();
      spawnSparkles(3);
    };

    $('#saveBtn').onclick = () => {
      try {
        renderer.render(scene, camera);
        const dataURL = renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'roblox-princess.png';
        link.href = dataURL;
        link.click();
        showToast('📸 저장 완료!');
        soundFx('magic');
        spawnSparkles(10);
      } catch (e) {
        showToast('⚠️ 저장 실패');
      }
    };

    const poses = ['idle', 'wave', 'cheer'];
    let poseIndex = 0;
    function applyPose() {
      const p = poses[poseIndex];
      const t = Date.now() * 0.001;
      leftArm.pivot.rotation.set(0, 0, 0.1);
      rightArm.pivot.rotation.set(0, 0, -0.1);
      leftLeg.pivot.rotation.set(0, 0, 0);
      rightLeg.pivot.rotation.set(0, 0, 0);

      if (p === 'wave') {
        rightArm.pivot.rotation.z = Math.PI - 0.5 + Math.sin(t * 6) * 0.3;
        leftArm.pivot.rotation.z = 0.2;
      } else if (p === 'cheer') {
        leftArm.pivot.rotation.z = 2.5;
        rightArm.pivot.rotation.z = -2.5;
      }
    }

    function nextPose() {
      poseIndex = (poseIndex + 1) % poses.length;
      const names = { idle: '기본', wave: '인사', cheer: '만세' };
      showToast('🙌 ' + names[poses[poseIndex]]);
      soundFx();
    }

    $('#poseBtn').onclick = nextPose;
    $('#poseActionBtn').onclick = nextPose;

    // ---------- 반응형 ----------
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        camera.aspect = stage.clientWidth / stage.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(stage.clientWidth, stage.clientHeight);
      }, 100);
    });

    // ---------- 애니메이션 ----------
    function animate() {
      requestAnimationFrame(animate);
      const t = Date.now() * 0.001;

      character.position.y = Math.sin(t * 2) * 0.025;
      character.rotation.y = Math.sin(t * 0.5) * 0.05;

      if (itemsGroup.wings.children.length > 0) {
        itemsGroup.wings.rotation.z = Math.sin(t * 4) * 0.12;
        itemsGroup.wings.rotation.x = Math.sin(t * 3) * 0.05;
      }

      applyPose();
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    renderTabs();
    renderSelector(active);
  </script>
</body>
</html>
