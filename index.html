<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 마떼루요 오이쉬 강남여짜💅 럭셔리 갓생 챌린지 🌈</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @keyframes rainbowAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        :root {
            --hot-pink: #ff007f;
            --neon-pink: #ff66cc;
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-main: #1a1a1a;
            --text-sub: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff007f);
            background-size: 800% 800%;
            animation: rainbowAnimation 8s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
            overflow: hidden;
            border: 4px solid #ffffff;
        }

        header {
            background: linear-gradient(135deg, #ff007f 0%, #ff66cc 50%, #8b00ff 100%);
            color: white;
            padding: 45px 20px;
            text-align: center;
            position: relative;
        }

        .level-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.35);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 900;
            margin-bottom: 14px;
            backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.25);
            letter-spacing: -0.5px;
            line-height: 1.4;
        }

        header p {
            font-size: 0.95rem;
            font-weight: 700;
            opacity: 0.95;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .status-bar {
            padding: 24px 25px;
            background: #ffffff;
            border-bottom: 3px solid #ffccff;
        }

        .status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 900;
            color: var(--hot-pink);
        }

        .exp-track {
            width: 100%;
            height: 16px;
            background: #ffe6f2;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ff99cc;
        }

        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff, #ff007f);
            background-size: 400% 400%;
            animation: rainbowAnimation 4s linear infinite;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px;
        }

        .calendar-section {
            padding: 25px;
            background: rgba(255, 240, 245, 0.5);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 16px;
            color: var(--hot-pink);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-label {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--text-sub);
            padding-bottom: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: #ffffff;
            border: 2px solid #ffb3d9;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            user-select: none;
            overflow: hidden;
            padding: 4px;
        }

        .day-cell:hover {
            border-color: var(--hot-pink);
            background-color: #fff0f5;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 0, 127, 0.35);
        }

        .day-cell.completed {
            background: #e6ffed;
            border-color: #00cc66;
            box-shadow: 0 4px 12px rgba(0, 204, 102, 0.3);
        }

        .day-cell.completed .date-num {
            color: #00994d;
            background: rgba(255, 255, 255, 0.85);
        }

        .day-cell.today {
            border: 3px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            animation: rainbow-bounce 1.5s infinite alternate;
        }

        @keyframes rainbow-bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .day-cell.today .date-num {
            color: #cc0066;
            font-weight: 900;
            background: rgba(255, 255, 255, 0.9);
        }

        .date-num {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-main);
            z-index: 2;
            background: rgba(255, 255, 255, 0.75);
            padding: 1px 5px;
            border-radius: 6px;
            width: 100%;
            text-align: center;
        }

        .day-status-icon {
            font-size: 0.9rem;
            z-index: 2;
            margin-bottom: auto;
            margin-top: auto;
        }

        .detail-panel {
            background: #ffffff;
            border-radius: 22px;
            padding: 24px;
            margin-top: 25px;
            border: 3px solid #ff99cc;
            box-shadow: 0 8px 25px rgba(255, 153, 204, 0.3);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .detail-date-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--hot-pink);
        }

        .mission-box {
            background: #fff0f5;
            padding: 18px;
            border-radius: 16px;
            border: 2.5px solid #ffb3d9;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: inset 0 2px 6px rgba(255, 0, 127, 0.05);
        }

        .mission-box input[type="checkbox"] {
            margin-top: 4px;
            width: 24px;
            height: 24px;
            accent-color: var(--hot-pink);
            cursor: pointer;
        }

        .mission-content label {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-main);
            cursor: pointer;
            display: block;
            margin-bottom: 4px;
        }

        .mission-content span {
            font-size: 0.92rem;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 700;
        }

        .footer-actions {
            text-align: center;
            margin-top: 20px;
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: underline;
            padding: 10px 16px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            color: #ff0000;
            background-color: #ffe6e6;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { border-radius: 24px; }
            header { padding: 35px 15px; }
            header h1 { font-size: 1.3rem; }
            header p { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="level-badge" id="levelBadge">💅 마떼루요 오이쉬 루키</div>
            <h1>마떼루요🔥 오이쉬✨<br>민 🩵초에 민 🍫초에 민 🦷초를 더 ➕해서 어 ⭐머 깜 @짝 1아 🥴 눈 👁 부 🌟셔 눈 👀 부 @셔 이건 😒뭐 oh 민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨</h1>
            <p>마떼루요 & 오이쉬 넘치는 강남여짜💅들의 우아하고 찬란한 레인보우 갓생 챌린지 (7/24 ~ 8/19)</p>
        </header>

        <div class="status-bar">
            <div class="status-info">
                <span id="expText">전체 달성도: 0%</span>
                <span id="scoreText">0 / 27일 완료</span>
            </div>
            <div class="exp-track">
                <div class="exp-fill" id="expFill"></div>

        </div>

        <div class="calendar-section">
            <div class="section-title">
                <span>✨ 쌈뽕 캘린더</span>
            </div>

            <div class="date-grid" id="dateGrid">
                <div class="day-label" style="color: #ff0000;">일</div>
                <div class="day-label">월</div>
                <div class="day-label">화</div>
                <div class="day-label">수</div>
                <div class="day-label">목</div>
                <div class="day-label">금</div>

            <div class="detail-panel" id="detailPanel">

                        캘린더에서 날짜를 클릭하여<br>오늘의 럭셔리한 강남여짜💅 미션을 확인하세요! ✨

            </div>

    <script>
        const startDate = new Date(2026, 6, 24); // 7월 24일
        const endDate = new Date(2026, 7, 19);   // 8월 19일

        let datesArray = [];
        let currentDateIter = new Date(startDate);
        const startDayOfWeek = startDate.getDay(); 

        while (currentDateIter <= endDate) {
            datesArray.push(new Date(currentDateIter));
            currentDateIter.setDate(currentDateIter.getDate() + 1);
        }

        // 요청하신 "민초뉴월드" 밈 문구들을 완벽하게 띄어쓰기별로 재조합하여 날마다 들어가는 27가지 미션 리스트

            { title: "민 🩵초에 민 🍫초에", desc: "- 민 🦷초를 더 ➕해서 어 ⭐머\n- 완벽한 민초 조합 연구하기 🌿" },
            { title: "깜 @짝 1아 🥴 눈 👁 부 🌟셔", desc: "- 눈 👀 부 @셔 이건 😒뭐 oh\n- 눈부신 비주얼 장착하기 💅" },
            { title: "민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨", desc: "- 민 🩵초에 민 🦷초를 더 ➕해서\n- 새로운 트렌드 선도하기 🚀" },
            { title: "어 ⭐머 깜 @짝 1아 🥴", desc: "- 눈 👁 부 🌟셔 눈 👀 부 @셔\n- 깜짝 놀랄 만한 미모 가꾸기 💕" },
            { title: "이건 😒뭐 oh 민 🍫초", desc: "- 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨ 민 🩵초에\n- 독보적인 아라베스크 무드 뽐내기 🌟" },
            { title: "민 🍫초에 민 🦷초를 더 ➕해서", desc: "- 어 ⭐머 깜 @짝 1아 🥴\n- 화려한 초콜릿 감성 채우기 🍫" },
            { title: "눈 👁 부 🌟셔 눈 👀 부 @셔", desc: "- 이건 😒뭐 oh 민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨\n- 반짝이는 일상 만들기 ✨" },
            { title: "민 🩵초에 민 🍫초에 민 🦷초를", desc: "- 더 ➕해서 어 ⭐머 깜 @짝 1아 🥴\n- 민초단 대통합의 날 🌿" },
            { title: "눈 👁 부 🌟셔 눈 👀 부 @셔", desc: "- 이건 😒뭐 oh 민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨\n- 시선을 사로잡는 스타일링 💖" },
            { title: "민 🩵초에 민 🍫초에", desc: "- 민 🦷초를 더 ➕해서 어 ⭐머\n- 향긋한 민트향 가득 채우기 🍃" },
            { title: "깜 @짝 1아 🥴 눈 👁 부 🌟셔", desc: "- 눈 👀 부 @셔 이건 😒뭐 oh\n- 힙하고 찬란한 무드 발산 👑" },
            { title: "민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨", desc: "- 민 🩵초에 민 🦷초를 더 ➕해서\n- 새로운 세계로 발돋움하기 ✈️" },
            { title: "어 ⭐머 깜 @짝 1아 🥴", desc: "- 눈 👁 부 🌟셔 눈 👀 부 @셔\n- 주변을 놀라게 할 갓생 챌린지 🔥" },
            { title: "이건 😒뭐 oh 민 🍫초", desc: "- 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨ 민 🩵초에\n- 트렌디한 감성 온몸으로 느끼기 🎶" },
            { title: "민 🍫초에 민 🦷초를 더 ➕해서", desc: "- 어 ⭐머 깜 @짝 1아 🥴\n- 달콤쌉싸름한 힐링 타임 ☕" },
            { title: "눈 👁 부 🌟셔 눈 👀 부 @셔", desc: "- 이건 😒뭐 oh 민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨\- 눈부신 자태로 홈캉스 즐기기 🛋️" },
            { title: "민 🩵초에 민 🍫초에 민 🦷초를", desc: "- 더 ➕해서 어 ⭐머 깜 @짝 1아 🥴\n- 완벽한 삼중 민초 플렉스 💸" },
            { title: "눈 👁 부 🌟셔 눈 👀 부 @셔", desc: "- 이건 😒뭐 oh 민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨\n- 찬란한 여름방학 주인공 되기 🎬" },
            { title: "민 🩵초에 민 🍫초에", desc: "- 민 🦷초를 더 ➕해서 어 ⭐머\n- 상쾌함과 달콤함의 조화 🧊" },
            { title: "깜 @짝 1아 🥴 눈 👁 부 🌟셔", desc: "- 눈 👀 부 @셔 이건 😒뭐 oh\n- 짜릿한 반전 매력 뽐내기 ⚡" },
            { title: "민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨", desc: "- 민 🩵초에 민 🦷초를 더 ➕해서\n- 민초 뉴 월드 그 자체 되기 🌍" },
            { title: "어 ⭐머 깜 @짝 1아 🥴", desc: "- 눈 👁 부 🌟셔 눈 👀 부 @셔\n- 깜짝 놀랄 집중력 발휘하기 🎯" },
            { title: "이건 😒뭐 oh 민 🍫초", desc: "- 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨ 민 🩵초에\n- 독보적인 아우라 뿜어내기 ✨" },
            { title: "민 🍫초에 민 🦷초를 더 ➕해서", desc: "- 어 ⭐머 깜 @짝 1아 🥴\n- 갓생 루틴 완벽하게 클리어 🏆" },
            { title: "눈 👁 부 🌟셔 눈 👀 부 @셔", desc: "- 이건 😒뭐 oh 민 🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭 ✨\n- 대망의 피날레 찬란한 엔딩 💖" }
        ];

        let completedDays = JSON.parse(localStorage.getItem('gangnam_yojja_mincho_days')) || {};
        
        const todayReal = new Date();
        let selectedDateIndex = 0; 

        datesArray.forEach((d, idx) => {
            if (d.getDate() === todayReal.getDate() && d.getMonth() === todayReal.getMonth() && d.getFullYear() === todayReal.getFullYear()) {
                selectedDateIndex = idx;
            }
        });

        const dateGrid = document.getElementById('dateGrid');
        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const missionContainer = document.getElementById('missionContainer');
        const expFill = document.getElementById('expFill');
        const expText = document.getElementById('expText');
        const scoreText = document.getElementById('scoreText');
        const levelBadge = document.getElementById('levelBadge');

        function renderCalendar() {
            const labels = Array.from(dateGrid.querySelectorAll('.day-label'));
            dateGrid.innerHTML = '';
            labels.forEach(label => dateGrid.appendChild(label));

            for (let i = 0; i < startDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                dateGrid.appendChild(emptyCell);
            }

            datesArray.forEach((dateObj, index) => {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const dateNum = dateObj.getDate();
                const monthNum = dateObj.getMonth() + 1;
                const dateKey = `${monthNum}-${dateNum}`;

                if (completedDays[dateKey]) {
                    cell.classList.add('completed');
                }

                if (dateObj.getDate() === todayReal.getDate() && dateObj.getMonth() === todayReal.getMonth() && dateObj.getFullYear() === todayReal.getFullYear()) {
                    cell.classList.add('today');
                }

                if (index === selectedDateIndex) {
                    cell.style.outline = '3.5px solid #ff007f';
                } else {
                    cell.style.outline = 'none';
                }

                cell.innerHTML = `
                    <span class="date-num">${dateNum}</span>
                    <span class="day-status-icon">${completedDays[dateKey] ? '💎' : '🍃'}</span>
                `;

                cell.onclick = () => {
                    selectedDateIndex = index;
                    renderCalendar();
                    renderDetailPanel();
                };

                dateGrid.appendChild(cell);
            });

            updateStatus();
        }

        function renderDetailPanel() {
            const dateObj = datesArray[selectedDateIndex];
            const monthNum = dateObj.getMonth() + 1;
            const dateNum = dateObj.getDate();
            const dateKey = `${monthNum}-${dateNum}`;
            
            selectedDateTitle.innerText = `${monthNum}월 ${dateNum}일 (${getDayName(dateObj.getDay())}) 럭셔리 미션`;

            const isCompleted = completedDays[dateKey] || false;
            const currentMission = dailyHobbyMissions[selectedDateIndex % dailyHobbyMissions.length];

            missionContainer.innerHTML = `
                <div class="mission-box">
                    <input type="checkbox" id="missionCheck" ${isCompleted ? 'checked' : ''} onchange="toggleMission('${dateKey}')">
                    <div class="mission-content">
                        <label for="missionCheck">${currentMission.title}</label>
                        <span>${currentMission.desc.replace(/\n/g, '<br>')}</span>
                    </div>
                </div>
            `;
        }

        function getDayName(dayIndex) {
            return ['일', '월', '화', '수', '목', '금', '토'][dayIndex];
        }

        function toggleMission(dateKey) {
            const checkbox = document.getElementById('missionCheck');
            completedDays[dateKey] = checkbox.checked;
            localStorage.setItem('gangnam_yojja_mincho_days', JSON.stringify(completedDays));
            renderCalendar();
            renderDetailPanel();
        }

        function updateStatus() {
            const totalDays = datesArray.length;
            const completedCount = Object.values(completedDays).filter(val => val === true).length;
            const percentage = Math.round((completedCount / totalDays) * 100);

            expFill.style.width = `${percentage}%`;
            expText.innerText = `전체 달성도: ${percentage}%`;
            scoreText.innerText = `${completedCount} / ${totalDays}일 완료`;

            if (percentage >= 80) {
                levelBadge.innerText = "👑 럭셔리 갓생 마스터";
            } else if (percentage >= 60) {
                levelBadge.innerText = "🔥 쌈뽕 폭발 핫걸";
            } else if (percentage >= 40) {
                levelBadge.innerText = "⚡ 빛나는 레인보우 뮤즈";
            } else if (percentage >= 20) {
                levelBadge.innerText = "🌸 프리티 루키";
            } else {
                levelBadge.innerText = "💅 마떼루요 오이쉬 루키";
            }
        }

        function resetData() {
            if (confirm("정말 모든 기록을 초기화하시겠습니까?")) {
                localStorage.removeItem('gangnam_yojja_mincho_days');
                completedDays = {};
                renderCalendar();
                renderDetailPanel();
            }
        }

        renderCalendar();
        renderDetailPanel();
    </script>
</body>
</html>
