<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 강남여짜💅 럭셔리 갓생 챌린지 🌈</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @keyframes rainbowAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        :root {
            --hot-pink: #ff007f;
            --neon-pink: #ff66cc;
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-main: #1a1a1a;
            --text-sub: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff007f);
            background-size: 800% 800%;
            animation: rainbowAnimation 8s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
            overflow: hidden;
            border: 4px solid #ffffff;
        }

        header {
            background: linear-gradient(135deg, #ff007f 0%, #ff66cc 50%, #8b00ff 100%);
            color: white;
            padding: 45px 20px;
            text-align: center;
            position: relative;
        }

        .level-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.35);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 900;
            margin-bottom: 14px;
            backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.25);
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        header p {
            font-size: 0.95rem;
            font-weight: 700;
            opacity: 0.95;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .status-bar {
            padding: 24px 25px;
            background: #ffffff;
            border-bottom: 3px solid #ffccff;
        }

        .status-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 900;
            color: var(--hot-pink);
        }

        .exp-track {
            width: 100%;
            height: 16px;
            background: #ffe6f2;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ff99cc;
        }

        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff, #ff007f);
            background-size: 400% 400%;
            animation: rainbowAnimation 4s linear infinite;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px;
        }

        .calendar-section {
            padding: 25px;
            background: rgba(255, 240, 245, 0.5);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 16px;
            color: var(--hot-pink);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-label {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--text-sub);
            padding-bottom: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: #ffffff;
            border: 2.5px solid #ffb3d9;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            user-select: none;
        }

        .day-cell:hover {
            border-color: var(--hot-pink);
            background-color: #fff0f5;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.35);
        }

        .day-cell.completed {
            background: #e6ffed;
            border-color: #00cc66;
            box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3);
        }

        .day-cell.completed .date-num {
            color: #00994d;
        }

        .day-cell.today {
            background: linear-gradient(135deg, #fff0f5 0%, #ffccff 50%, #e6f2ff 100%);
            border: 3.5px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            animation: rainbow-bounce 1.5s infinite alternate;
        }

        @keyframes rainbow-bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .day-cell.today .date-num {
            color: #cc0066;
            font-weight: 900;
        }

        .date-num {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .day-status-icon {
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .detail-panel {
            background: #ffffff;
            border-radius: 22px;
            padding: 24px;
            margin-top: 25px;
            border: 3px solid #ff99cc;
            box-shadow: 0 8px 25px rgba(255, 153, 204, 0.3);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .detail-date-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--hot-pink);
        }

        .mission-box {
            background: #fff0f5;
            padding: 18px;
            border-radius: 16px;
            border: 2.5px solid #ffb3d9;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: inset 0 2px 6px rgba(255, 0, 127, 0.05);
        }

        .mission-box input[type="checkbox"] {
            margin-top: 4px;
            width: 24px;
            height: 24px;
            accent-color: var(--hot-pink);
            cursor: pointer;
        }

        .mission-content label {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-main);
            cursor: pointer;
            display: block;
            margin-bottom: 4px;
        }

        .mission-content span {
            font-size: 0.92rem;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 700;
        }

        .footer-actions {
            text-align: center;
            margin-top: 20px;
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            text-decoration: underline;
            padding: 10px 16px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            color: #ff0000;
            background-color: #ffe6e6;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { border-radius: 24px; }
            header { padding: 35px 15px; }
            header h1 { font-size: 1.6rem; }
            header p { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="level-badge" id="levelBadge">💅 강남여짜 럭셔리 루키</div>
            <h1>민🩵초에 민🍫초에 민🦷초를 더➕해서 어⭐머 깜@짝1아🥴 눈👁부🌟셔 눈👀부@셔 이건😒뭐 oh 민🍫초 𝓝𝓮𝔀 𝔀𝓸𝓾𝓵𝓭✨</h1>

                <div class="day-label">금</div>

                    <span class="detail-date-title" id="selectedDateTitle">날짜를 선택해주세요</span>

                    </p>
                </div>
            </div>

            <div class="footer-actions">
                <button class="reset-btn" onclick="resetData()">기록 초기화하기</button>
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date(2026, 6, 24); // 7월 24일
        const endDate = new Date(2026, 7, 19);   // 8월 19일

        let datesArray = [];
        let currentDateIter = new Date(startDate);
        const startDayOfWeek = startDate.getDay(); 

        while (currentDateIter <= endDate) {
            datesArray.push(new Date(currentDateIter));
            currentDateIter.setDate(currentDateIter.getDate() + 1);
        }

        // 럭셔리 말투의 강남여짜💅 취미 미션 리스트 (27가지)

            { title: "홈베이킹으로 시그니처 럭셔리 디저트 굽기 🧁", desc: "- 프리미엄 르뱅 쿠키나 상큼한 요거트 타르트 도전하기\n- 완벽한 플레이팅과 함께 인증 샷으로 영속시키기 ✨" },
            { title: "프랑스 자수로 우아한 인테리어 소품 완성 🧵", desc: "- 패브릭 파우치나 손수건에 섬세한 플로럴 수놓기\n- 고요하고 우아한 시간 속에서 잡념을 완벽히 소거하기" },

            { title: "향수 공방에서 나만의 시그니처 아로마 조조 🌸", desc: "- 취향에 맞는 플로럴과 우디 노트를 우아하게 블렌딩하기\n- 세상에 단 하나뿐인 내면의 향수 네이밍 완성하기" },
            { title: "홈필라테스로 완벽한 바디 라인업 스트레칭 🧘‍♀️", desc: "- 코어를 단단하게 잡아주는 우아한 전신 스트레칭 30분\n- 폼롤러로 숨겨진 라인까지 부드럽게 정돈하기 💫" },

            { title: "턴테이블 선율과 함께하는 우아한 홈 카페 ☕", desc: "- 에스프레소 투 샷 내려 바닐라 라떼 완벽하게 제조하기\n- 창밖의 풍경을 감상하며 여유로운 티타임 만끽하기" },
            { title: "반려 식물 분갈이 및 미니 테라리움 연출 🌱", desc: "- 싱그러운 초록빛 반려 식물에게 우거진 보금자리 선물\n- 투명한 유리병 속 나만의 작은 프라이빗 정원 꾸미기" },
            { title: "하이엔드 섀도잉과 팝송 가사 완벽 마스터 🎶", desc: "- 팝스타의 감성을 담아 트렌디한 발음으로 따라 부르기\n- 원어민 섀도잉으로 지성과 매력을 동시에 장착하기" },

            { title: "영감 가득한 나만의 힙한 콜라주 스크랩북 ✂️", desc: "- 감각적인 매거진과 스티커로 다이어리 페이지 채우기\n- 하나뿐인 예술적인 무드의 콜라주 작품 완성하기" },
            { title: "우아한 운동복 갖춰 입고 선선한 야간 산책 🏃‍♀️", desc: "- 가벼운 발걸음으로 선선한 밤공기 만끽하며 걷기\n- 좋아하는 음악과 함께 5천 보 채우며 힐링 다지기" },

            { title: "감성 터지는 인디 아트 영화 한 편 감상하기 🎟️", desc: "- OTT를 통해 여운이 깊은 독립 영화 정주행하기\n- 영화 속 주옥같은 대사와 감정을 다이어리에 기록" },
            { title: "플라워 마켓에서 직접 고른 꽃으로 화병 채우기 💐", desc: "- 싱그러운 생화를 직접 골라 조화롭게 손질하기\n- 화병에 우아하게 꽂아 방 안의 공기마저 화사하게" },
            { title: "유쾌한 파티 게임으로 일상의 스트레스 타파 🎮", desc: "- 스마트한 두뇌 회전과 위트 있는 게임으로 리프레시\n- 지루할 틈 없는 짜릿한 승부로 엔돌핀 충전하기" },
            { title: "모던 캘리그라피로 감성적인 손글씨 남기기 ✍️", desc: "- 만년필의 사각거리는 소리와 함께 감성 글씨체 연마\n- 가슴에 새기고 싶은 명언을 예술적으로 적어보기" },
            { title: "골목길 숨겨진 독립 서점 투어 및 도서 쇼핑 📚", desc: "- 고요하고 아기자기한 감성의 독립 서점 방문하기\n- 개성 넘치는 독립 출판물 속에서 영감 얻기" },
            { title: "여름방학 총결산 및 다음 시즌 위시리스트 작성 📝", desc: "- 방학 동안 이뤄낸 눈부신 갓생 성과들 우아하게 회고\n- 다가올 미래를 위한 새로운 럭셔리 위시리스트 구상" }
        ];

        let completedDays = JSON.parse(localStorage.getItem('gangnam_yojja_mincho_days')) || {};
        
        const todayReal = new Date();
        let selectedDateIndex = 0; 

        datesArray.forEach((d, idx) => {
            if (d.getDate() === todayReal.getDate() && d.getMonth() === todayReal.getMonth() && d.getFullYear() === todayReal.getFullYear()) {
                selectedDateIndex = idx;
            }
        });

        const dateGrid = document.getElementById('dateGrid');
        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const missionContainer = document.getElementById('missionContainer');
        const expFill = document.getElementById('expFill');
        const expText = document.getElementById('expText');
        const scoreText = document.getElementById('scoreText');
        const levelBadge = document.getElementById('levelBadge');

        function renderCalendar() {
            const labels = Array.from(dateGrid.querySelectorAll('.day-label'));
            dateGrid.innerHTML = '';
            labels.forEach(label => dateGrid.appendChild(label));

            for (let i = 0; i < startDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                dateGrid.appendChild(emptyCell);
            }

            datesArray.forEach((dateObj, index) => {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const dateNum = dateObj.getDate();
                const monthNum = dateObj.getMonth() + 1;
                const dateKey = `${monthNum}-${dateNum}`;

                if (completedDays[dateKey]) {
                    cell.classList.add('completed');
                }

                if (dateObj.getDate() === todayReal.getDate() && dateObj.getMonth() === todayReal.getMonth() && dateObj.getFullYear() === todayReal.getFullYear()) {
                    cell.classList.add('today');
                }

                if (index === selectedDateIndex) {
                    cell.style.outline = '3.5px solid #ff007f';
                } else {
                    cell.style.outline = 'none';
                }

                cell.innerHTML = `
                    <span class="date-num">${dateNum}</span>
                    <span class="day-status-icon">${completedDays[dateKey] ? '💎' : ''}</span>
                `;

                cell.onclick = () => {
                    selectedDateIndex = index;
                    renderCalendar();
                    renderDetailPanel();
                };

                dateGrid.appendChild(cell);
            });

            updateStatus();
        }

        function renderDetailPanel() {
            const dateObj = datesArray[selectedDateIndex];
            const monthNum = dateObj.getMonth() + 1;
            const dateNum = dateObj.getDate();
            const dateKey = `${monthNum}-${dateNum}`;
            
            selectedDateTitle.innerText = `${monthNum}월 ${dateNum}일 (${getDayName(dateObj.getDay())}) 럭셔리 미션`;

            const isCompleted = completedDays[dateKey] || false;
            const currentMission = dailyHobbyMissions[selectedDateIndex % dailyHobbyMissions.length];

            missionContainer.innerHTML = `
                <div class="mission-box">
                    <input type="checkbox" id="missionCheck" ${isCompleted ? 'checked' : ''} onchange="toggleMission('${dateKey}')">
                    <div class="mission-content">
                        <label for="missionCheck">${currentMission.title}</label>
                        <span>${currentMission.desc.replace(/\n/g, '<br>')}</span>
                    </div>
                </div>
            `;
        }

        function getDayName(dayIndex) {
            return ['일', '월', '화', '수', '목', '금', '토'][dayIndex];
        }

        function toggleMission(dateKey) {
            const checkbox = document.getElementById('missionCheck');
            completedDays[dateKey] = checkbox.checked;
            localStorage.setItem('gangnam_yojja_mincho_days', JSON.stringify(completedDays));
            renderCalendar();
            renderDetailPanel();
        }

        function updateStatus() {
            const totalDays = datesArray.length;
            const completedCount = Object.values(completedDays).filter(val => val === true).length;
            const percentage = Math.round((completedCount / totalDays) * 100);

            expFill.style.width = `${percentage}%`;
            expText.innerText = `전체 달성도: ${percentage}%`;
            scoreText.innerText = `${completedCount} / ${totalDays}일 완료`;

            if (percentage >= 80) {
                levelBadge.innerText = "👑 럭셔리 갓생 마스터";
            } else if (percentage >= 60) {
                levelBadge.innerText = "🔥 쌈뽕 폭발 핫걸";
            } else if (percentage >= 40) {
                levelBadge.innerText = "⚡ 빛나는 레인보우 뮤즈";
            } else if (percentage >= 20) {
                levelBadge.innerText = "🌸 프리티 루키";
            } else {
                levelBadge.innerText = "💅 강남여짜 럭셔리 루키";
            }
        }

        function resetData() {
            if (confirm("정말 모든 기록을 초기화하시겠습니까?")) {
                localStorage.removeItem('gangnam_yojja_mincho_days');
                completedDays = {};
                renderCalendar();
                renderDetailPanel();
            }
        }

        renderCalendar();
        renderDetailPanel();
    </script>
</body>
</html>
