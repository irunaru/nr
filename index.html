<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>키라키라 마법소녀 드레스업 스튜디오</title>
    <style>
        :root {
            --primary-pink: #ff69b4;
            --light-pink: #ffebf0;
            --accent-purple: #9370db;
            --sky-blue: #87ceeb;
            --gold: #ffd700;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
        }

        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            height: -webkit-fill-available;
            max-height: 812px;
            background: #fff0f5;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 3px solid #fff;
            border-radius: 0;
        }

        @media (min-width: 376px) {
            .phone-frame {
                border-radius: 28px;
                height: 92vh;
                height: calc(92vh - var(--safe-bottom));
                max-height: 820px;
            }
        }

        .header {
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid #ffccd5;
            z-index: 10;
            flex-shrink: 0;
        }

        .title {
            font-size: 17px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff1493, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: #fff;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            min-width: 38px;
            min-height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 18px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .icon-btn:active {
            transform: scale(0.88);
            background: #fff0f5;
        }

        .stage {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.5s ease;
            min-height: 0;
        }

        .bg-room {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
        }
        .bg-castle {
            background: linear-gradient(135deg, #e0bbe4 0%, #957dad 100%);
        }
        .bg-garden {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
        }
        .bg-stage {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
        }

        .character-container {
            width: 250px;
            height: 340px;
            max-width: 90vw;
            max-height: 55vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatChar 3s ease-in-out infinite alternate;
        }

        @keyframes floatChar {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-6px);
            }
        }

        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .layer svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.07));
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.96);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 25px rgba(255, 105, 180, 0.18);
            display: flex;
            flex-direction: column;
            z-index: 10;
            border-top: 3px solid #ffccd5;
            flex-shrink: 0;
            padding-bottom: var(--safe-bottom);
        }

        .category-tabs {
            display: flex;
            overflow-x: auto;
            padding: 10px 10px 6px 10px;
            gap: 7px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #fff5f8;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #d81b60;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 40px;
            display: flex;
            align-items: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border-color: #ff1493;
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.3);
            transform: translateY(-1px);
        }

        .item-selector {
            height: 100px;
            padding: 6px 10px 12px 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            align-items: center;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .item-card {
            min-width: 66px;
            height: 80px;
            background: #fff;
            border: 2px solid #ffd1dc;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 3px;
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .item-card.selected {
            border-color: #ff1493;
            background: #fff0f5;
            box-shadow: 0 6px 14px rgba(255, 20, 147, 0.22);
            transform: scale(1.03);
        }

        .item-preview {
            width: 44px;
            height: 44px;
            pointer-events: none;
        }

        .item-preview svg {
            width: 100%;
            height: 100%;
        }

        .item-name {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            line-height: 1.1;
        }

        .action-bar {
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 12px 12px;
            background: #fff;
            border-top: 1px solid #ffebf0;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 12px 6px;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn:active {
            transform: scale(0.95);
            opacity: 0.85;
        }

        .btn-random {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #2b6cb0;
        }
        .btn-reset {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #c05621;
        }
        .btn-save {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #b83280;
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            animation: sparkleAnim 0.8s linear forwards;
        }

        @keyframes sparkleAnim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(1.5) rotate(180deg);
                opacity: 0;
            }
        }

        /* 아이폰 SE2 등 작은 화면에서 추가 최적화 */
        @media (max-width: 374px) {
            .character-container {
                width: 220px;
                height: 300px;
            }
            .item-card {
                min-width: 58px;
                height: 72px;
            }
            .item-preview {
                width: 38px;
                height: 38px;
            }
            .tab-btn {
                font-size: 11px;
                padding: 7px 10px;
            }
            .action-btn {
                font-size: 12px;
                padding: 10px 4px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="header">
            <div class="title">✨ 키라키라 프린세스 ✨</div>
            <div class="header-btns">
                <button class="icon-btn" id="bgToggleBtn" title="배경 변경" aria-label="배경 변경">🏰</button>
                <button class="icon-btn" id="soundBtn" title="효과음" aria-label="효과음 켜기/끄기">🎵</button>
            </div>
        </div>

        <div class="stage bg-room" id="stageBg">
            <div class="character-container" id="characterStage">
                <!-- 올바른 오버레이 레이어 순서 (뒤에서 앞으로) -->
                <div class="layer" id="layer-wings"></div>
                <div class="layer" id="layer-body"></div>
                <div class="layer" id="layer-shoes"></div>
                <div class="layer" id="layer-dress"></div>
                <div class="layer" id="layer-hair"></div>
                <div class="layer" id="layer-tiara"></div>
                <div class="layer" id="layer-accessory"></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="category-tabs" id="categoryTabs">
                <button class="tab-btn active" data-category="dress">👗 드레스</button>
                <button class="tab-btn" data-category="hair">💇‍♀️ 헤어</button>
                <button class="tab-btn" data-category="shoes">👠 신발</button>
                <button class="tab-btn" data-category="tiara">👑 티아라</button>
                <button class="tab-btn" data-category="wings">🧚 날개</button>
                <button class="tab-btn" data-category="accessory">✨ 액세서리</button>
            </div>

            <div class="item-selector" id="itemSelector"></div>

            <div class="action-bar">
                <button class="action-btn btn-random" id="randomBtn">🎲 랜덤코디</button>
                <button class="action-btn btn-reset" id="resetBtn">🔄 초기화</button>
                <button class="action-btn btn-save" id="saveBtn">📸 저장하기</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let soundEnabled = true;
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        console.warn('Web Audio API not supported');
                        soundEnabled = false;
                        updateSoundButton();
                        return null;
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            }

            function updateSoundButton() {
                const btn = document.getElementById('soundBtn');
                if (btn) btn.textContent = soundEnabled ? '🎵' : '🔇';
            }

            function playSound(type) {
                if (!soundEnabled) return;
                const ctx = initAudio();
                if (!ctx) return;

                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    const now = ctx.currentTime;

                    if (type === 'click') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(587.33, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.09);
                    } else if (type === 'magic') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(554.37, now + 0.06);
                        osc.frequency.setValueAtTime(659.25, now + 0.12);
                        osc.frequency.setValueAtTime(880, now + 0.2);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                        osc.start(now);
                        osc.stop(now + 0.36);
                    }
                } catch (e) {
                    console.warn('Sound play error:', e);
                }
            }

            // 캐릭터와 의상 SVG 데이터 정의
            const db = {
                body: [{
                    id: 'default',
                    name: '기본베이스',
                    svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <rect x="92" y="90" width="16" height="25" fill="#ffe0bd" rx="5"/>
                    <path d="M80 110 Q100 120 120 110 L115 150 Q100 155 85 150 Z" fill="#ffe0bd"/>
                    <path d="M82 112 Q100 120 118 112 L115 135 Q100 140 85 135 Z" fill="#ffb6c1"/>
                    <rect x="86" y="145" width="11" height="100" fill="#ffe0bd" rx="5"/>
                    <rect x="103" y="145" width="11" height="100" fill="#ffe0bd" rx="5"/>
                    <path d="M80 112 Q65 140 70 170" stroke="#ffe0bd" stroke-width="10" stroke-linecap="round" fill="none"/>
                    <path d="M120 112 Q135 140 130 170" stroke="#ffe0bd" stroke-width="10" stroke-linecap="round" fill="none"/>
                    <ellipse cx="100" cy="70" rx="30" ry="34" fill="#ffe0bd"/>
                    <circle cx="69" cy="72" r="6" fill="#ffe0bd"/>
                    <circle cx="131" cy="72" r="6" fill="#ffe0bd"/>
                    <path d="M82 58 Q88 54 94 58" stroke="#8b4513" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path d="M106 58 Q112 54 118 58" stroke="#8b4513" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <ellipse cx="88" cy="68" rx="6" ry="8" fill="#4b2e83"/>
                    <circle cx="86" cy="65" r="2.5" fill="#fff"/>
                    <circle cx="89" cy="71" r="1.2" fill="#fff"/>
                    <ellipse cx="112" cy="68" rx="6" ry="8" fill="#4b2e83"/>
                    <circle cx="110" cy="65" r="2.5" fill="#fff"/>
                    <circle cx="113" cy="71" r="1.2" fill="#fff"/>
                    <ellipse cx="80" cy="76" rx="5" ry="3" fill="#ff80ab" opacity="0.6"/>
                    <ellipse cx="120" cy="76" rx="5" ry="3" fill="#ff80ab" opacity="0.6"/>
                    <circle cx="100" cy="74" r="1" fill="#e5989b"/>
                    <path d="M96 82 Q100 87 104 82" stroke="#d81b60" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>`
                }],
                dress: [
                    { id: 'none', name: '속옷차림', svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"></svg>` },
                    {
                        id: 'dress1',
                        name: '핑크스타',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="pinkGrad1" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ff69b4"/>
                            <stop offset="100%" stop-color="#ff1493"/>
                        </linearGradient>
                    </defs>
                    <path d="M78 110 Q100 115 122 110 L145 205 Q100 225 55 205 Z" fill="url(#pinkGrad1)"/>
                    <path d="M78 110 Q100 125 122 110 L130 145 Q100 155 70 145 Z" fill="#fff" opacity="0.5"/>
                    <circle cx="100" cy="130" r="7" fill="#ffd700"/>
                </svg>`
                    },
                    {
                        id: 'dress2',
                        name: '라벤더문',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="purpleGrad1" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#dda0dd"/>
                            <stop offset="100%" stop-color="#8a2be2"/>
                        </linearGradient>
                    </defs>
                    <path d="M78 110 Q100 115 122 110 L150 210 Q100 230 50 210 Z" fill="url(#purpleGrad1)"/>
                    <polygon points="100,125 104,137 117,137 106,145 110,157 100,149 90,157 94,145 83,137 96,137" fill="#ffd700"/>
                </svg>`
                    },
                    {
                        id: 'dress3',
                        name: '스카이엔젤',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="skyGrad1" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#b0e0e6"/>
                            <stop offset="100%" stop-color="#1e90ff"/>
                        </linearGradient>
                    </defs>
                    <path d="M78 110 Q100 115 122 110 L155 215 Q100 230 45 215 Z" fill="url(#skyGrad1)"/>
                    <ellipse cx="100" cy="160" rx="35" ry="12" fill="#fff" opacity="0.6"/>
                </svg>`
                    }
                ],
                hair: [
                    {
                        id: 'hair1',
                        name: '트윈웨이브',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <path d="M68 60 Q35 80 45 150 Q30 110 60 70 Z" fill="#ff69b4"/>
                    <path d="M132 60 Q165 80 155 150 Q170 110 140 70 Z" fill="#ff69b4"/>
                    <path d="M70 52 Q100 30 130 52 Q136 68 126 62 Q100 50 74 62 Q64 68 70 52 Z" fill="#ff1493"/>
                </svg>`
                    },
                    {
                        id: 'hair2',
                        name: '롱실키',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <path d="M68 52 Q100 25 132 52 Q142 80 138 180 Q122 170 128 90 Q100 65 72 90 Q78 170 62 180 Q58 80 68 52 Z" fill="#9370db"/>
                </svg>`
                    },
                    {
                        id: 'hair3',
                        name: '포니테일',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                    <path d="M125 55 Q175 60 160 140 Q145 120 135 85 Z" fill="#ffd700"/>
                    <path d="M70 52 Q100 28 130 52 Q135 68 122 62 Q100 52 78 62 Q65 68 70 52 Z" fill="#ffcc00"/>
                </svg>`
                    }
                ],
                shoes: [
                    { id: 'shoes1', name: '핑크구두',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"><ellipse cx="91" cy="242" rx="8" ry="5" fill="#ff1493"/><ellipse cx="109" cy="242" rx="8" ry="5" fill="#ff1493"/></svg>` },
                    { id: 'shoes2', name: '블루부츠',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"><path d="M83 225 L83 245 L97 245 L97 225 Z" fill="#1e90ff"/><path d="M103 225 L103 245 L117 245 L117 225 Z" fill="#1e90ff"/></svg>` }
                ],
                tiara: [
                    { id: 'none', name: '없음',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"></svg>` },
                    { id: 'tiara1', name: '하트티아라',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"><path d="M82 42 L91 28 L100 38 L109 28 L118 42 Z" fill="#ffd700"/><circle cx="100" cy="33" r="3" fill="#ff1493"/></svg>` },
                    { id: 'tiara2', name: '스타크라운',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"><polygon points="100,22 103,30 112,30 105,35 107,43 100,38 93,43 95,35 88,30 97,30" fill="#ffd700"/></svg>` }
                ],
                wings: [
                    { id: 'none', name: '없음',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"></svg>` },
                    { id: 'wings1', name: '페어리윙즈',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"><path d="M68 110 Q28 80 38 120 Q58 140 73 130 Z" fill="#b0e0e6" opacity="0.8"/><path d="M132 110 Q172 80 162 120 Q142 140 127 130 Z" fill="#b0e0e6" opacity="0.8"/></svg>` }
                ],
                accessory: [
                    { id: 'none', name: '없음',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"></svg>` },
                    { id: 'wand', name: '마법봉',
                        svg: `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet"><line x1="135" y1="160" x2="150" y2="130" stroke="#ffd700" stroke-width="3"/><polygon points="150,120 153,128 161,130 155,136 157,144 150,140 143,144 145,136 139,130 147,128" fill="#ff1493"/></svg>` }
                ]
            };

            const currentOutfit = {
                body: 'default',
                dress: 'dress1',
                hair: 'hair1',
                shoes: 'shoes1',
                tiara: 'tiara1',
                wings: 'wings1',
                accessory: 'wand'
            };

            const categoryTabs = document.getElementById('categoryTabs');
            const itemSelector = document.getElementById('itemSelector');
            const stageBg = document.getElementById('stageBg');
            const soundBtn = document.getElementById('soundBtn');

            let activeCategory = 'dress';

            function updateLayers() {
                Object.keys(currentOutfit).forEach(cat => {
                    const layerEl = document.getElementById(`layer-${cat}`);
                    if (layerEl) {
                        const itemId = currentOutfit[cat];
                        const itemObj = db[cat].find(i => i.id === itemId);
                        layerEl.innerHTML = itemObj ? itemObj.svg : '';
                    }
                });
            }

            function renderItemSelector(category) {
                if (!itemSelector || !db[category]) return;
                itemSelector.innerHTML = '';
                const items = db[category];
                const currentId = currentOutfit[category];

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `item-card${currentId === item.id ? ' selected' : ''}`;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', item.name);
                    card.setAttribute('tabindex', '0');
                    card.innerHTML = `
                    <div class="item-preview">${item.svg}</div>
                    <div class="item-name">${item.name}</div>
                `;
                    card.addEventListener('click', () => {
                        playSound('click');
                        currentOutfit[category] = item.id;
                        updateLayers();
                        renderItemSelector(category);
                        createSparkleEffect();
                    });
                    // 키보드 접근성
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            card.click();
                        }
                    });
                    itemSelector.appendChild(card);
                });

                // 선택된 아이템으로 스크롤
                const selectedCard = itemSelector.querySelector('.item-card.selected');
                if (selectedCard) {
                    selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }

            // 카테고리 탭 이벤트
            categoryTabs.addEventListener('click', (e) => {
                const tabBtn = e.target.closest('.tab-btn');
                if (!tabBtn) return;
                playSound('click');
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                tabBtn.classList.add('active');
                activeCategory = tabBtn.getAttribute('data-category');
                renderItemSelector(activeCategory);
            });

            // 배경 변경
            const bgList = ['bg-room', 'bg-castle', 'bg-garden', 'bg-stage'];
            let bgIndex = 0;
            document.getElementById('bgToggleBtn').addEventListener('click', () => {
                playSound('click');
                stageBg.classList.remove(bgList[bgIndex]);
                bgIndex = (bgIndex + 1) % bgList.length;
                stageBg.classList.add(bgList[bgIndex]);
            });

            // 효과음 토글
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                updateSoundButton();
                if (soundEnabled) playSound('click');
            });

            // 랜덤 코디
            document.getElementById('randomBtn').addEventListener('click', () => {
                playSound('magic');
                Object.keys(db).forEach(cat => {
                    if (cat === 'body') return;
                    const items = db[cat];
                    const randIndex = Math.floor(Math.random() * items.length);
                    currentOutfit[cat] = items[randIndex].id;
                });
                updateLayers();
                renderItemSelector(activeCategory);
                createSparkleEffect();
            });

            // 초기화
            document.getElementById('resetBtn').addEventListener('click', () => {
                playSound('click');
                currentOutfit.dress = 'none';
                currentOutfit.shoes = 'shoes1';
                currentOutfit.tiara = 'none';
                currentOutfit.wings = 'none';
                currentOutfit.accessory = 'none';
                currentOutfit.hair = 'hair1';
                updateLayers();
                renderItemSelector(activeCategory);
            });

            // 저장
            document.getElementById('saveBtn').addEventListener('click', () => {
                playSound('magic');
                // iOS에서는 알림 대신 시각적 피드백 제공
                const saveBtn = document.getElementById('saveBtn');
                const originalText = saveBtn.textContent;
                saveBtn.textContent = '✅ 저장 완료!';
                saveBtn.style.background = 'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)';
                setTimeout(() => {
                    saveBtn.textContent = originalText;
                    saveBtn.style.background = '';
                }, 1500);
                createSparkleEffect();
            });

            function createSparkleEffect() {
                const count = 4;
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = '✨';
                    sparkle.style.left = `${Math.random() * 70 + 15}%`;
                    sparkle.style.top = `${Math.random() * 50 + 25}%`;
                    sparkle.style.fontSize = `${Math.random() * 12 + 14}px`;
                    fragment.appendChild(sparkle);
                }
                stageBg.appendChild(fragment);
                setTimeout(() => {
                    const sparkles = stageBg.querySelectorAll('.sparkle');
                    sparkles.forEach(s => s.remove());
                }, 850);
            }

            // iOS Safari에서 active 상태 유지 버그 방지
            document.addEventListener('touchstart', function() {}, { passive: true });

            // 초기화
            updateLayers();
            renderItemSelector('dress');
            updateSoundButton();
        })();
    </script>
</body>
</html>
