<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>여름방학 달력</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background:linear-gradient(135deg,#7DD3FC,#E0F7FF);
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:2.4rem;
}

.subtitle{
    text-align:center;
    margin-bottom:35px;
    color:#555;
    font-size:1.1rem;
}

.month{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:35px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.month h2{
    text-align:center;
    color:#0A84FF;
    margin-bottom:20px;
}

.weekdays,
.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.weekdays div{
    background:#E8F5FF;
    text-align:center;
    padding:12px;
    font-weight:bold;
    border:1px solid #D8ECFF;
}

.days div{
    min-height:95px;
    border:1px solid #EEE;
    padding:8px;
    position:relative;
    background:white;
    transition:.25s;
}

.days div:hover{
    background:#F6FCFF;
}

.empty{
    background:#FAFAFA !important;
}

.date{
    font-weight:bold;
}

.vacation{
    background:#FFF8C9 !important;
}

/* 오늘 날짜 */
.today{
    background:#7C3AED !important;
    color:white;
    border:5px solid #FFD700 !important;
    border-radius:18px;
    transform:scale(1.08);
    z-index:10;
    animation:pulse 1s infinite;
}

.today .date{
    font-size:24px;
    font-weight:bold;
}

.today .badge{
    position:absolute;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    background:#FFD700;
    color:#7C3AED;
    font-weight:bold;
    padding:4px 10px;
    border-radius:30px;
    font-size:12px;
}

@keyframes pulse{

0%{
box-shadow:0 0 5px gold;
}

50%{
box-shadow:
0 0 15px gold,
0 0 35px gold,
0 0 55px #ff0;
}

100%{
box-shadow:0 0 5px gold;
}

}

.footer{
    text-align:center;
    font-size:1.1rem;
    margin-top:10px;
}

@media(max-width:700px){

.days div{
    min-height:70px;
}

.today .date{
    font-size:18px;
}

}

</style>

</head>
<body>

<div class="container">

<h1>🏖️ 여름방학 달력</h1>

<div class="subtitle">
2026년 7월 24일 ~ 8월 19일
</div>

<div id="calendar"></div>

<div class="footer">
🌴 즐거운 여름방학 보내세요!
</div>

</div>

<script>

const vacationStart=new Date(2026,6,24);
const vacationEnd=new Date(2026,7,19);

// 실제 오늘 날짜
const today=new Date();

const months=[
{month:6,title:"7월"},
{month:7,title:"8월"}
];

const week=["일","월","화","수","목","금","토"];

const calendar=document.getElementById("calendar");

months.forEach(info=>{

const section=document.createElement("div");
section.className="month";

const title=document.createElement("h2");
title.textContent=`2026년 ${info.title}`;

section.appendChild(title);

const weekdays=document.createElement("div");
weekdays.className="weekdays";

week.forEach(day=>{
const d=document.createElement("div");
d.textContent=day;
weekdays.appendChild(d);
});

section.appendChild(weekdays);

const days=document.createElement("div");
days.className="days";

const firstDay=new Date(2026,info.month,1).getDay();
const lastDate=new Date(2026,info.month+1,0).getDate();

for(let i=0;i<firstDay;i++){
const empty=document.createElement("div");
empty.className="empty";
days.appendChild(empty);
}

for(let d=1;d<=lastDate;d++){

const cell=document.createElement("div");

const current=new Date(2026,info.month,d);

const num=document.createElement("div");
num.className="date";
num.textContent=d;

cell.appendChild(num);

if(current>=vacationStart && current<=vacationEnd){
cell.classList.add("vacation");
}

if(
current.getMonth()===today.getMonth() &&
current.getDate()===today.getDate()
){
cell.classList.add("today");

const badge=document.createElement("div");
badge.className="badge";
badge.textContent="⭐ 오늘 ⭐";
cell.appendChild(badge);
}

days.appendChild(cell);

}

section.appendChild(days);

calendar.appendChild(section);

});

</script>

</body>
</html>
